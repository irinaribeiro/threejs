  <script>
    // Helper for draggable windows with close button
    function makeDraggable(winId, closeId) {
      const win = document.getElementById(winId);
      const closeBtn = document.getElementById(closeId);
      let isDragging = false;
      let dragOffsetX = 0;
      let dragOffsetY = 0;

      win.addEventListener('mousedown', function(e) {
        if (e.target === closeBtn) return;
        isDragging = true;
        win.style.cursor = 'grabbing';
        if (win.style.right && win.style.left === '') {
          win.style.left = (window.innerWidth - win.offsetWidth - parseInt(win.style.right)) + 'px';
          win.style.right = '';
        }
        if (win.style.bottom && win.style.top === '') {
          win.style.top = (window.innerHeight - win.offsetHeight - parseInt(win.style.bottom)) + 'px';
          win.style.bottom = '';
        }
        dragOffsetX = e.clientX - win.offsetLeft;
        dragOffsetY = e.clientY - win.offsetTop;
        e.preventDefault();
      });

      document.addEventListener('mousemove', function(e) {
        if (isDragging) {
          let newLeft = e.clientX - dragOffsetX;
          let newTop = e.clientY - dragOffsetY;
          newLeft = Math.max(0, Math.min(window.innerWidth - win.offsetWidth, newLeft));
          newTop = Math.max(0, Math.min(window.innerHeight - win.offsetHeight, newTop));
          win.style.left = newLeft + 'px';
          win.style.top = newTop + 'px';
        }
      });

      document.addEventListener('mouseup', function() {
        if (isDragging) {
          isDragging = false;
          win.style.cursor = 'grab';
        }
      });

      closeBtn.addEventListener('click', function(e) {
        win.style.display = 'none';
        e.stopPropagation();
      });
    }

    makeDraggable('microsoft-window', 'microsoft-close-btn');
    makeDraggable('olr-window', 'olr-close-btn');
    makeDraggable('isep-window', 'isep-close-btn');
    makeDraggable('oracle-window', 'oracle-close-btn');
  </script>
